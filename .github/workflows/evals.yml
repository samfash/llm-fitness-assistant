name: Evals (live model)
on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF model id (defaults to HF_MODEL / repo default)"
        required: false
  schedule:
    - cron: "0 6 * * 1"   # weekly
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pydantic huggingface_hub
      - name: Run golden set against the live model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          python -m evals.run --mode live --record \
            ${MODEL:+--model "$MODEL"} \
            --baseline evals/baseline.json \
            --report evals/results/report.md
      - name: Publish report
        if: always()
        run: cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results/
            evals/recordings/
